<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic 2-Tier Rubber Duck</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 100%); display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .container { width: 100%; max-width: 900px; height: auto; position: relative; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(3deg); } }
        @keyframes wave { 0% { transform: translateX(0); } 100% { transform: translateX(-400px); } }
        @keyframes wave-reverse { 0% { transform: translateX(-400px); } 100% { transform: translateX(0); } }
        @keyframes cloud-move { 0% { transform: translateX(-100px); opacity: 0.8; } 50% { opacity: 1; } 100% { transform: translateX(900px); opacity: 0.8; } }
        .duck-group { animation: float 3.5s ease-in-out infinite; transform-origin: 400px 360px; }
        .wave-layer-1 { animation: wave 4s linear infinite; }
        .wave-layer-2 { animation: wave-reverse 5s linear infinite; }
        .wave-layer-3 { animation: wave 7s linear infinite; }
        .cloud-1 { animation: cloud-move 25s linear infinite; }
        .cloud-2 { animation: cloud-move 35s linear infinite; animation-delay: -15s; }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="duckGrad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#FFF59D"/>
                    <stop offset="40%" stop-color="#FFEB3B"/>
                    <stop offset="100%" stop-color="#F57F17"/>
                </radialGradient>
                <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#FF9800"/>
                    <stop offset="100%" stop-color="#E65100"/>
                </linearGradient>
                <linearGradient id="water1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.9"/><stop offset="100%" stop-color="#0288D1" stop-opacity="0.9"/></linearGradient>
                <linearGradient id="water2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#29B6F6" stop-opacity="0.75"/><stop offset="100%" stop-color="#01579B" stop-opacity="0.85"/></linearGradient>
                <linearGradient id="water3" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#81D4FA" stop-opacity="0.8"/><stop offset="100%" stop-color="#0277BD" stop-opacity="0.95"/></linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#01579B" flood-opacity="0.4"/></filter>
            </defs>

            <!-- 배경 요소 -->
            <circle cx="680" cy="120" r="50" fill="#FFEE58" opacity="0.9"><animate attributeName="r" values="50;55;50" dur="4s" repeatCount="indefinite"/></circle>
            <g class="cloud-1" fill="#FFFFFF"><path d="M 50 150 Q 70 120 110 140 Q 150 100 190 140 Q 230 130 240 170 L 50 170 Z" /></g>
            <g class="cloud-2" fill="#FFFFFF" transform="scale(0.8) translate(300, -50)"><path d="M 50 150 Q 70 120 110 140 Q 150 100 190 140 Q 230 130 240 170 L 50 170 Z" /></g>

            <path class="wave-layer-3" d="M -400 400 Q -300 370 -200 400 T 0 400 T 200 400 T 400 400 T 600 400 T 800 400 T 1000 400 T 1200 400 L 1200 600 L -400 600 Z" fill="url(#water3)"/>

            <!-- 오리 그룹 (장식 제거, 2단 구조) -->
            <g class="duck-group" filter="url(#shadow)">
                <!-- 꼬리 -->
                <path d="M 230 370 C 130 290 140 240 190 400 Z" fill="url(#duckGrad)"/>
                
                <!-- 몸통 (2단) -->
                <ellipse cx="380" cy="370" rx="180" ry="105" fill="url(#duckGrad)"/>
                
                <!-- 머리 (몸통과 바로 연결) -->
                <circle cx="480" cy="240" r="85" fill="url(#duckGrad)"/>
                
                <!-- 날개 (단순한 버전으로 복구) -->
                <path d="M 290 360 C 310 280 430 310 440 380 C 450 440 270 430 290 360 Z" fill="#F9A825" stroke="#F57F17" stroke-width="3" opacity="0.9"/>
                <path d="M 330 370 Q 380 340 400 390" fill="none" stroke="#F57F17" stroke-width="3" stroke-linecap="round"/>
                
                <!-- 눈 (단순한 원형 하이라이트 1개) -->
                <circle cx="510" cy="210" r="12" fill="#212121"/>
                <circle cx="505" cy="205" r="4" fill="#FFFFFF"/>
                
                <!-- 부리 (단순한 버전으로 복구, 머리 위치에 맞춤) -->
                <path d="M 555 220 C 640 210 655 250 640 265 C 595 275 560 265 545 255 Z" fill="url(#beakGrad)" stroke="#E65100" stroke-width="2"/>
                <path d="M 545 255 C 605 275 600 300 575 295 C 555 290 530 275 525 265 Z" fill="#EF6C00" stroke="#E65100" stroke-width="2"/>
            </g>

            <path class="wave-layer-2" d="M -800 450 Q -700 490 -600 450 T -400 450 T -200 450 T 0 450 T 200 450 T 400 450 T 600 450 T 800 450 T 1000 450 T 1200 450 L 1200 600 L -800 600 Z" fill="url(#water2)"/>
            <path class="wave-layer-1" d="M -400 490 Q -300 460 -200 490 T 0 490 T 200 490 T 400 490 T 600 490 T 800 490 T 1000 490 T 1200 490 L 1200 600 L -400 600 Z" fill="url(#water1)"/>
        </svg>
    </div>
</body>
</html>
