<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러버덕 페이지</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #87CEEB 0%, #E0F6FF 100%);
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        h1 {
            position: absolute;
            top: 40px;
            color: white;
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .water {
            width: 100%;
            height: 30%;
            background: linear-gradient(180deg, #4DB8FF 0%, #0099FF 100%);
            position: relative;
            overflow: hidden;
        }
        .wave {
            position: absolute;
            width: 200%;
            height: 100px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,60 Q300,30 600,60 T1200,60 L1200,120 L0,120 Z" fill="%2363D7E8" opacity="0.3"/></svg>') repeat-x;
            bottom: 0;
            animation: wave 6s linear infinite;
        }
        .wave:nth-child(2) {
            animation: wave 8s linear infinite reverse;
            opacity: 0.5;
            bottom: 10px;
        }
        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }
        .duck-container {
            position: absolute;
            bottom: 80px;
            animation: bob 3s ease-in-out infinite;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0px) rotateZ(0deg); }
            25% { transform: translateY(-15px) rotateZ(-2deg); }
            50% { transform: translateY(-20px) rotateZ(0deg); }
            75% { transform: translateY(-10px) rotateZ(2deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦆 러버덕 🦆</h1>
        
        <div class="duck-container">
            <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- 오리 몸 (러버덕 스타일) -->
                <ellipse cx="100" cy="110" rx="55" ry="70" fill="#FFD700" stroke="#F0C000" stroke-width="2"/>
                
                <!-- 오리 목 -->
                <ellipse cx="100" cy="50" rx="30" ry="35" fill="#FFD700" stroke="#F0C000" stroke-width="2"/>
                
                <!-- 오리 머리 (둥근 모양) -->
                <circle cx="100" cy="25" r="28" fill="#FFD700" stroke="#F0C000" stroke-width="2"/>
                
                <!-- 오리 부리 (작고 귀여운 모양) -->
                <ellipse cx="123" cy="22" rx="16" ry="12" fill="#FF8C00" stroke="#FF6B00" stroke-width="1.5"/>
                
                <!-- 부리 끝 -->
                <circle cx="138" cy="22" r="4" fill="#FF6B00"/>
                
                <!-- 눈 (크고 귀여운 눈) -->
                <circle cx="110" cy="18" r="5" fill="black"/>
                <circle cx="112" cy="16" r="2.5" fill="white"/>
                
                <!-- 다리 (물 위에 약간 보임) -->
                <line x1="80" y1="175" x2="75" y2="190" stroke="#FF6B35" stroke-width="8" stroke-linecap="round"/>
                <line x1="120" y1="175" x2="125" y2="190" stroke="#FF6B35" stroke-width="8" stroke-linecap="round"/>
                
                <!-- 발 (웹 모양) -->
                <g id="left-foot">
                    <circle cx="75" cy="190" r="6" fill="#FF6B35"/>
                    <line x1="75" y1="190" x2="68" y2="197" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                    <line x1="75" y1="190" x2="75" y2="197" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                    <line x1="75" y1="190" x2="82" y2="197" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                </g>
                
                <g id="right-foot">
                    <circle cx="125" cy="190" r="6" fill="#FF6B35"/>
                    <line x1="125" y1="190" x2="118" y2="197" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                    <line x1="125" y1="190" x2="125" y2="197" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                    <line x1="125" y1="190" x2="132" y2="197" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                </g>
                
                <!-- 윙크 표정 -->
                <circle cx="90" cy="18" r="4" fill="black"/>
                <path d="M 88 23 Q 90 25 92 23" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                
                <!-- 작은 꼬리 (러버덕 스타일) -->
                <path d="M 50 100 Q 30 90 28 110 Q 30 115 40 112" fill="#FFD700" stroke="#F0C000" stroke-width="1.5"/>
                
                <!-- 광택 효과 -->
                <ellipse cx="115" cy="75" rx="20" ry="30" fill="white" opacity="0.3"/>
            </svg>
        </div>
        
        <div class="water">
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>
</body>
</html>
