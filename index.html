<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fff8f1">
    <title>두기의 탄생까지</title>
    <style>
        :root {
            --ink: #332c2a;
            --muted: #8f827b;
            --accent: #f28b6b;
            --card: rgba(255, 255, 255, 0.72);
            --line: rgba(70, 55, 45, 0.08);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            background:
                radial-gradient(circle at 15% 12%, rgba(255, 215, 187, .75), transparent 30%),
                radial-gradient(circle at 88% 85%, rgba(207, 231, 255, .8), transparent 34%),
                linear-gradient(145deg, #fffaf5 0%, #fff4ed 48%, #eef6ff 100%);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            filter: blur(2px);
            opacity: .28;
            pointer-events: none;
        }

        body::before {
            background: #ffd9c9;
            top: -110px;
            left: -80px;
        }

        body::after {
            background: #cce4ff;
            right: -100px;
            bottom: -120px;
        }

        .page {
            width: min(92vw, 430px);
            position: relative;
            z-index: 1;
        }

        .card {
            position: relative;
            padding: 34px 24px 28px;
            text-align: center;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, .9);
            border-radius: 32px;
            box-shadow:
                0 24px 70px rgba(91, 68, 55, .14),
                inset 0 1px 0 rgba(255,255,255,.8);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .animals {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 2.35rem;
            line-height: 1;
            margin-bottom: 22px;
        }

        .animal {
            display: inline-block;
            animation: float 3.6s ease-in-out infinite;
        }

        .animal:nth-child(2) {
            animation-delay: -.8s;
        }

        .title {
            margin: 0;
            font-size: clamp(1.35rem, 6vw, 1.7rem);
            font-weight: 700;
            letter-spacing: -.045em;
            line-height: 1.5;
        }

        .name {
            display: inline-block;
            margin: 4px 2px;
            font-size: clamp(2rem, 10vw, 2.65rem);
            font-weight: 900;
            letter-spacing: -.07em;
            background: linear-gradient(135deg, #ed765a, #e9a13d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .baby {
            font-size: 1.55rem;
            vertical-align: .08em;
        }

        .countdown-wrap {
            margin: 24px 0 18px;
            padding: 20px 12px 17px;
            border-radius: 24px;
            background: rgba(255,255,255,.62);
            border: 1px solid var(--line);
        }

        .countdown {
            margin: 0;
            font-size: clamp(4.1rem, 22vw, 6.4rem);
            line-height: .9;
            font-weight: 900;
            letter-spacing: -.075em;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .days {
            margin-top: 10px;
            color: var(--muted);
            font-size: .92rem;
            font-weight: 600;
            letter-spacing: .02em;
        }

        .family {
            font-size: 1.65rem;
            line-height: 1;
            letter-spacing: .12em;
            margin-top: 19px;
        }

        .date {
            margin-top: 17px;
            color: var(--muted);
            font-size: .78rem;
            letter-spacing: .08em;
        }

        .sparkle {
            position: absolute;
            color: #e9a13d;
            font-size: .9rem;
            animation: twinkle 2.4s ease-in-out infinite;
        }

        .s1 {
            top: 24px;
            left: 30px;
        }

        .s2 {
            top: 54px;
            right: 30px;
            animation-delay: -.9s;
        }

        .s3 {
            bottom: 34px;
            left: 46px;
            animation-delay: -.4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-7px) rotate(2deg);
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: .25;
                transform: scale(.85);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .animal,
            .sparkle {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card" aria-label="두기 탄생 카운트다운">

            <span class="sparkle s1">✦</span>
            <span class="sparkle s2">✧</span>
            <span class="sparkle s3">✦</span>

            <div class="animals" aria-hidden="true">
                <span class="animal">🦆</span>
                <span class="animal">🦁</span>
            </div>

            <h1 class="title">
                <span>🦄</span>
                <span class="name">두기</span>
                <span class="baby">👶</span>
                탄생까지
            </h1>

            <div class="countdown-wrap">
                <div id="countdown" class="countdown" aria-live="polite">--</div>
                <div class="days">D-DAY · 2027.01.16</div>
            </div>

            <div class="family" aria-hidden="true">👨‍👩‍👧</div>

            <div class="date" id="today"></div>
        </section>
    </main>

    <script>
        const target = new Date('2027-01-16T00:00:00+09:00');
        const countdown = document.getElementById('countdown');
        const today = document.getElementById('today');

        function update() {
            const now = new Date();
            const diff = target.getTime() - now.getTime();

            const days = Math.max(
                0,
                Math.ceil(diff / 86400000)
            );

            countdown.textContent = `D-${days}`;

            today.textContent = now.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        update();

        setInterval(update, 60000);
    </script>
</body>
</html>
